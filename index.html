/* ---------- BOUTIQUE : données séparées de l'affichage ----------
   Pour ajouter un produit : { id, name, category, price, description } dans PRODUCTS.
   Catégories possibles (aucune n'existe encore) : renseigner CATEGORIES au besoin. */
const CATEGORIES=[];
const PRODUCTS=[
{id:"test",name:"Test PayPal",price:0.01,description:"Produit de test à 1 centime (à supprimer avant le lancement)"}
];
/* ---------- PAYPAL ----------
   1) PAYPAL.account = ton lien PayPal.me (déjà réglé) ou ton email PayPal (là le pseudo est envoyé automatiquement avec le paiement).
   2) Chaque produit ajouté dans PRODUCTS avec un "price" (ex: 4.99) reçoit AUTOMATIQUEMENT son bouton PayPal.
   Exemple : {id:"vip",name:"Grade VIP",category:"Grades",price:4.99,description:"Kit VIP + préfixe"} */
const PAYPAL={account:"paypal.me/czzerMC",currency:"EUR"};
function ppUrl(p,pseudo){const a=PAYPAL.account.trim(),n=p.name+" - pseudo: "+pseudo;
 if(/paypal\.me/i.test(a))return"https://"+a.replace(/^https?:\/\//,"").replace(/\/+$/,"")+"/"+String(p.price).replace(",",".")+PAYPAL.currency;
 return"https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business="+encodeURIComponent(a)+"&item_name="+encodeURIComponent(n)+"&item_number="+encodeURIComponent(p.id||"")+"&custom="+encodeURIComponent(pseudo)+"&amount="+encodeURIComponent(String(p.price).replace(",","."))+"&currency_code="+PAYPAL.currency+"&no_shipping=1&no_note=1"}
function fmtPrice(p){return Number(String(p.price).replace(",",".")).toLocaleString("fr-FR",{style:"currency",currency:PAYPAL.currency})}
function prodCard(p,i){const has=p.price!==undefined&&p.price!=="";
 return`<div class="card prod"><h3>${esc(p.name)}</h3><p>${esc(p.description||"")}</p>${has?`<div class="price">${fmtPrice(p)}</div><input class="pseudo" type="text" maxlength="32" placeholder="Ton pseudo Minecraft" aria-label="Pseudo Minecraft" autocomplete="off"><button class="btn p paybtn" data-i="${i}">Payer avec PayPal</button><div class="payerr" role="alert" hidden>Entre ton pseudo Minecraft pour continuer.</div><div class="paynote" hidden></div>`:""}</div>`}
function grid(l){return l.length?`<div class="grid">${l.map(p=>prodCard(p,PRODUCTS.indexOf(p))).join("")}</div>`:`<div class="empty"><h3>Aucun produit trouvé.</h3></div>`}
function bindPay(){document.querySelectorAll(".paybtn").forEach(b=>b.onclick=()=>{const c=b.closest(".card"),v=c.querySelector(".pseudo").value.trim(),e=c.querySelector(".payerr");
 if(!v){e.hidden=false;c.querySelector(".pseudo").focus();return}e.hidden=true;const pr=PRODUCTS[+b.dataset.i],n=c.querySelector(".paynote");
 if(/paypal\.me/i.test(PAYPAL.account)){const t=pr.name+" - pseudo: "+v;try{navigator.clipboard.writeText(t)}catch(x){}n.textContent="Dans PayPal, écris ceci dans la note : "+t;n.hidden=false}
 window.open(ppUrl(pr,v),"_blank","noopener")})}

 html:`<p>Tape-les dans le chat. Certaines ouvrent un menu avec des boutons. Pour les trouver vite, utilise la recherche du site.</p>${tbl(["Commande","Rôle"],CMD_P.map(c=>[`<code>${c[0]}</code>`,c[1]]))}`},
{id:"grades-kits",cat:"Jouer",title:"Kits et grades",desc:"Les kits disponibles, leurs grades et leurs délais.",
 html:`<p>Ouvre <code>/galaxium:kit</code> pour choisir ton kit. Il y en a sept : Refill, Outils, Builder, Joueur, Galaxium, Galaxium Renforcé et Crystallium.</p>${tbl(["Kit","Grade nécessaire","Délai avant de le reprendre"],[["Refill","Aucun","60 secondes"],["Outils, Builder, Joueur","Aucun","Disponibles pour tous"],["Galaxium","Galaxium","1 heure"],["Galaxium Renforcé","Galaxium Renforcé","2 heures"],["Crystallium","Crystallium","3 heures"]])}
<h2 id="g">Les grades</h2><p>Les grades Galaxium, Galaxium Renforcé et Crystallium débloquent des kits plus puissants. Un grade plus haut te donne aussi accès aux kits des grades en dessous : avec Crystallium, tu peux prendre les trois.</p>
<div class="note w"><b>Attention</b>Pas de kit en plein combat : sors du combat d’abord.</div>`},
{id:"metiers",cat:"Jouer",title:"Métiers",desc:"Mineur, Farmeur et Guerrier : comment monter de niveau et ce que ça rapporte.",
 html:`<p>Trois métiers montent jusqu’au niveau 20. Tape <code>/galaxium:job</code> pour voir ta progression. À chaque niveau, tu reçois de l’argent (niveau × 250 $) et, à certains paliers, des clés, des objets ou des Gala Points.</p>
<h2 id="m">Gagner de l’XP</h2>${tbl(["Métier","Action","XP"],[["Mineur","Charbon, cuivre","1"],["Mineur","Fer, redstone, lapis, jade","2"],["Mineur","Or","3"],["Mineur","Diamant, Random Ore","5"],["Mineur","Galaxium","8"],["Mineur","Crystallium","15"],["Farmeur","Blé, carottes, patates, betteraves, baies, cacao, canne, cactus, bambou","1"],["Farmeur","Melon, citrouille, verrues du Nether","2"],["Guerrier","Tuer un joueur","50"],["Guerrier","Zombie / Squelette / Squelette Wither d’entraînement","0,1 / 0,5 / 1,5"]])}
<div class="note"><b>Bon à savoir</b>Les mines PVP ne comptent pas pour le Mineur, et une culture pas encore mûre ne donne pas d’XP au Farmeur.</div>
<h2 id="d">Ce que tu débloques</h2><ul><li>Mineur : le Galaxium au niveau 3, le Random Ore au niveau 7, le Crystallium au niveau 15.</li><li>Guerrier : les squelettes d’entraînement au niveau 6, les Squelettes Wither au niveau 14.</li></ul>
<h2 id="r">Récompenses de palier</h2>${tbl(["Niveau","Récompense"],[["3","Clé Galaxium"],["7","2 lingots de Galaxium"],["10","Clé Crystallium + 50 Gala Points"],["15","Clé Galaxium Renforcé + 100 Gala Points"],["18","Clé Rare"],["20","Lingot de Crystallium + Clé Rare + 250 Gala Points"]])}`},
{id:"factions",cat:"Jouer",title:"Factions",desc:"Créer ou rejoindre une faction, rôles et île.",
 html:`<p>Une faction, c’est ton équipe. Ouvre le menu avec <code>/galaxium:faction</code> (ou <code>/f</code>) pour créer une faction, inviter des joueurs, en exclure, promouvoir ou faire des alliances.</p>
<h2 id="a">À savoir</h2><ul><li>Le nom d’une faction fait 16 caractères maximum.</li><li>Il y a trois rôles : Chef, Officier et Membre.</li><li>Les terres de ta faction sont protégées par des claims.</li><li>Chaque faction a sa propre île de 25 × 25 blocs. Tu peux y construire jusqu’à la hauteur 150, et si tu tombes sous la hauteur 40, tu es ramené sur ton île.</li></ul>`},
{id:"events",cat:"Jouer",title:"KOTH, Outpost et Nexus",desc:"Les événements de zone à ne pas rater.",
 html:`<h2 id="koth">KOTH</h2><p>Tiens la zone pour marquer des points : la première équipe à atteindre <b>300 points</b> gagne. Un podium s’affiche 10 secondes à la fin.</p>
<h2 id="out">Outpost</h2><p>Capture l’avant-poste avec ta faction : il faut <b>150 secondes</b> dans la zone. Une fois capturé, il rapporte <b>25 $ par membre en ligne toutes les 10 secondes</b>. Les autres peuvent le décapturer en 150 secondes. Va-y avec <code>/galaxium:outpost</code>.</p>
<h2 id="nex">Nexus (boss)</h2><p>Le Nexus est un boss protégé par une cage. Toutes les 3 secondes, il envoie une onde qui t’inflige <b>3 cœurs</b> de dégâts à moins de 6 blocs et te repousse à moins de 8 blocs. Il invoque aussi des sbires toutes les 4 secondes, jusqu’à 8 en même temps. Quand il tombe, sa cage se brise puis le butin apparaît.</p>
<div class="note"><b>Conseil</b>Reste à bonne distance du boss entre deux ondes et occupe-toi des sbires.</div>`},
{id:"economie",cat:"Jouer",title:"Argent, market et échanges",desc:"Gagner, dépenser et échanger.",
 html:`<p>Le serveur a deux monnaies : l’<b>argent ($)</b> et les <b>Gala Points</b>.</p><ul><li><code>/galaxium:atm</code> : récupère l’argent gagné en étant connecté (0,2 $ par seconde).</li><li><code>/galaxium:market</code> : achète et vends aux autres joueurs.</li><li><code>/galaxium:sell</code> : vends ce que tu as dans la main (<code>hand</code>) ou ton inventaire (<code>inv</code>).</li><li><code>/galaxium:shop</code> : achète des objets au shop.</li><li><code>/galaxium:boutique</code> : la boutique en jeu, payée en Gala Points.</li><li><code>/galaxium:trade</code> : échange argent, Gala Points et objets avec un joueur.</li><li><code>/galaxium:pay</code> : envoie de l’argent à un joueur.</li></ul>
<div class="note"><b>Ne pas confondre</b>La boutique de ce site est vide pour le moment, elle est différente de la boutique en jeu.</div>`},
{id:"objets",cat:"Objets",title:"Minerais et équipements",desc:"Galaxium, Jade, Crystallium, Pickaxe of God et bâtons PVP.",
 html:`<h2 id="mi">Minerais</h2><p>Trois minerais propres au serveur : le <b>Galaxium</b>, le <b>Jade</b> et le <b>Crystallium</b>, avec leurs lingots et leurs blocs. Le <b>Minerai Aléatoire</b> peut lui aussi se miner.</p>
<h2 id="eq">Équipements</h2><ul><li>Galaxium : armure complète, épée, pioche et pomme de Galaxium.</li><li>Galaxium Renforcé : armure complète, épée et pioche.</li><li>Crystallium : armure complète, épée et pioche.</li><li>Jade : armure complète et épée.</li></ul>
<h2 id="fo">Galaxium Forge</h2><p>La forge permet de fabriquer l’armure Galaxium Renforcé à partir de lingots de Galaxium et de Poussière Nébuleuse. Pour la construire, il faut un cadre, un stabilisateur et un cœur de forge.</p>
<h2 id="pog">Pickaxe of God</h2><p>Une pioche à 20 niveaux : plus tu mines, plus elle monte et plus elle devient rapide. Le calculateur du wiki t’indique combien de blocs il te faut.</p>
<h2 id="st">Bâtons PVP</h2>${tbl(["Bâton","Délai","Effet"],[["Gel","2 min","Gèle un joueur jusqu’à 8 s, portée 6 blocs"],["Anti-Perle","1 min 30","Empêche les perles pendant 45 s"],["Vitesse","1 min","Vitesse I pendant 6 s"],["Soin","1 min 30","Rend 3 cœurs"],["Recul","45 s","Repousse les joueurs proches, portée 6 blocs"]])}
<p>Dans un combat, la perle de l’Ender a un délai de 16 secondes et la pomme en or de 30 secondes.</p>`},
{id:"outils",cat:"Outils",title:"Calculateurs",desc:"Estime ta progression de pioche, tes gains de métier et ton argent passif.",
 html:`<p>Déplace les curseurs pour faire tes calculs.</p>
<h2 id="pog">Pickaxe of God</h2><p>Combien de blocs miner entre deux niveaux ?</p><div class="tool" data-t="pog"><label>Niveau de départ <output></output></label><input type="range" min="1" max="20" value="1" aria-label="Niveau de départ"><label style="margin-top:10px">Niveau visé <output></output></label><input type="range" min="1" max="20" value="20" aria-label="Niveau visé"><div class="bar2"><i></i></div><p class="out"></p></div>
<h2 id="job">Argent des métiers</h2><p>Chaque niveau rapporte niveau × 250 $.</p><div class="tool" data-t="job"><label>Niveau de métier <output></output></label><input type="range" min="1" max="20" value="1" aria-label="Niveau de métier"><p class="out"></p></div>
<h2 id="atm">Argent passif</h2><p>Tu gagnes 0,2 $ par seconde connecté.</p><div class="tool" data-t="atm"><label>Heures connecté <output></output></label><input type="range" min="1" max="24" value="1" aria-label="Heures connecté"><p class="out"></p></div>
<h2 id="cd">Délais des kits</h2><div class="tool"><div class="kb"><span>Galaxium · 1 h</span><i style="--w:33%"></i></div><div class="kb"><span>Renforcé · 2 h</span><i style="--w:66%"></i></div><div class="kb"><span>Crystallium · 3 h</span><i style="--w:100%"></i></div></div>`}
];
/* ---------- moteur ---------- */
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/\s+/g," ");
const IDX=ARTS.map(a=>({a,t:(a.title+" "+a.desc+" "+a.cat+" "+strip(a.html)).toLowerCase(),plain:strip(a.html)}));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
IDX.forEach(i=>i.n=norm(i.t));
let q="";
const hl=(t,w)=>{if(!w)return esc(t);const r=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");return esc(t).replace(r,"<mark>$1</mark>")};
function side(cur){const cats=[...new Set(ARTS.map(a=>a.cat))];
 return `<aside class="side" id="sd"><button class="btn tg" id="tg" aria-expanded="false">Parcourir le wiki</button><div class="grp"><a href="#wiki" class="${!cur?"on":""}">Accueil du wiki</a>${cats.map(c=>`<h4>${c}</h4>${ARTS.filter(a=>a.cat===c).map(a=>`<a href="#wiki-${a.id}" class="${cur&&cur.id===a.id?"on":""}">${a.title}</a>`).join("")}`).join("")}</div></aside>`}
const CM=[...CMD_P.map(c=>[c[0],c[1],"commandes"])];
function find(s){const ks=norm(s.trim()).split(" ").filter(Boolean);if(!ks.length)return[];
 const a=IDX.filter(i=>ks.every(k=>i.n.includes(k))).map(i=>({k:i.a.cat,t:i.a.title,s:i.a.desc,h:"#wiki-"+i.a.id}));
 const c=CM.filter(m=>ks.every(k=>norm(m[0]+" "+m[1]).includes(k))).slice(0,8).map(m=>({k:"Commande",t:m[0],s:m[1],h:"#wiki-"+m[2]}));return a.concat(c)}
const list=(r,w)=>r.length?r.map(x=>`<a class="res fade" href="${x.h}"><small>${x.k}</small><br><b>${hl(x.t,w)}</b><p>${hl(x.s,w)}</p></a>`).join(""):`<div class="empty" style="margin-top:10px"><h3>Aucun résultat</h3><p>Essaie un autre mot-clé.</p></div>`;
function results(){const w=q.trim();return w?list(find(q),w.split(" ")[0]):""}
const ST=[50,60,80,90,130,150,210,260,310,400,470,630,740,1030,1160,1620,1740,2540,2630],RW={3:"Clé Galaxium",7:"2 lingots de Galaxium",10:"Clé Crystallium + 50 Gala Points",15:"Clé Galaxium Renforcé + 100 Gala Points",18:"Clé Rare",20:"Lingot de Crystallium, Clé Rare + 250 Gala Points"};
const fm=n=>n.toLocaleString("fr-FR");
function initTools(){document.querySelectorAll(".tool[data-t]").forEach(t=>{const r=[...t.querySelectorAll("input")],o=[...t.querySelectorAll("output")],out=t.querySelector(".out"),b=t.querySelector(".bar2 i"),k=t.dataset.t;
 const u=()=>{const v=r.map(x=>+x.value);o.forEach((e,i)=>e.textContent=v[i]);
  if(k==="pog"){let a=v[0],z=v[1];if(a>z){const w=a;a=z;z=w}const n=ST.slice(a-1,z-1).reduce((s,x)=>s+x,0);b.style.width=n/143+"%";out.innerHTML=`<b>${fm(n)}</b> blocs à miner du niveau ${a} au niveau ${z}, soit ${Math.round(n/143)} % du total de 14 300.`}
  if(k==="job"){const l=v[0];out.innerHTML=`Le niveau ${l} rapporte <b>${fm(l*250)} $</b>. Si tu es passé par chaque niveau : <b>${fm(250*l*(l+1)/2)} $</b> au total.`+(RW[l]?` Récompense commune : ${RW[l]}.`:"")}
  if(k==="atm")out.innerHTML=`<b>${fm(v[0]*720)} $</b> pour ${v[0]} h connecté.`};
 r.forEach(x=>x.oninput=u);u()})}
function orbit(){const C=220,O=[95,135,170],D=[40,56,76],N=[["Boutique","#shop",0,200],["Wiki","#wiki",0,35],["Kits","#wiki-grades-kits",1,300],["Métiers","#wiki-metiers",1,125],["Factions","#wiki-factions",2,200],["Événements","#wiki-events",2,330],["Outils","#wiki-outils",2,90]];
 return`<svg viewBox="0 0 440 450" role="group" aria-label="Carte des sections du site">${O.map((r,i)=>`<circle class="orb o${i+1}" cx="${C}" cy="${C}" r="${r}"/>`).join("")}<image href="${LOGO}" x="160" y="160" width="120" height="120" aria-hidden="true"/>${N.map(n=>{const r=O[n[2]],a=n[3]*Math.PI/180,x=(C+r*Math.cos(a)).toFixed(1),y=(C+r*Math.sin(a)).toFixed(1),v=n[2]==1?" rv":"",d=D[n[2]];return`<g class="rt${v}" style="--d:${d}s"><g class="ct${v}" style="--d:${d}s;transform-origin:${x}px ${y}px"><a class="nd" href="${n[1]}" aria-label="${n[0]}"><circle class="hit" cx="${x}" cy="${y}" r="26"/><circle class="dot" cx="${x}" cy="${y}" r="7"/><text x="${x}" y="${(+y)+27}" text-anchor="middle">${n[0]}</text></a></g></g>`}).join("")}</svg>`}
function initHome(){const i=$("#cn");if(!i)return;const o=$("#co");const s=()=>{const v=i.value;o.innerHTML=v.trim()?list(find(v).slice(0,5),v.trim().split(" ")[0]):""};i.oninput=s;document.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{i.value=b.dataset.fill;s();i.focus()})}
const pal=$("#pal"),pi=$("#pi");
function pr(){const v=pi.value;$("#pr").innerHTML=v.trim()?list(find(v).slice(0,8),v.trim().split(" ")[0]):`<p class="hint">Tape un mot : kit, faction, perle, Nexus, argent…</p>`}
function openP(){pal.hidden=false;pi.value="";pr();pi.focus()}
function closeP(){pal.hidden=true}
pi.oninput=pr;$("#pc").onclick=closeP;$("#pb").onclick=openP;pal.onclick=e=>{if(e.target===pal||e.target.closest("a"))closeP()};
pi.onkeydown=e=>{if(e.key==="Enter"){const a=$("#pr a");if(a){location.hash=a.getAttribute("href");closeP()}}};
function wikiHome(){return`<div class="wiki">${side()}<section class="fade"><div class="eyebrow">Wiki</div><h1 style="font-size:clamp(30px,5vw,46px)">Documentation du serveur</h1><p class="lead">Tout ce qu’il faut savoir pour bien jouer : commandes, kits, métiers, factions et événements.</p>
<div class="field" style="margin-top:22px" role="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Rechercher une commande, un objet…" aria-label="Rechercher dans le wiki" value="${esc(q)}" autocomplete="off"><button id="x" aria-label="Effacer la recherche" ${q?"":"hidden"}>×</button><kbd>/</kbd></div>
<div id="rs">${results()}</div><div id="cats" ${q?"hidden":""}><div class="grid">${[...new Set(ARTS.map(a=>a.cat))].map(c=>{const l=ARTS.filter(a=>a.cat===c);return`<a class="card" href="#wiki-${l[0].id}"><h3>${c}</h3><p>${l.map(a=>a.title).join(" · ")}</p></a>`}).join("")}</div></div></section></div>`}
function article(a){const i=ARTS.indexOf(a),p=ARTS[i-1],n=ARTS[i+1];
 const hs=[...a.html.matchAll(/<h2 id="([^"]+)">(.*?)<\/h2>/g)];
 return`<div class="wiki">${side(a)}<article class="fade"><div class="eyebrow">${a.cat}</div><h1 style="font-size:clamp(30px,5vw,44px)">${a.title}</h1><p class="lead">${a.desc}</p>${hs.length>1?`<nav class="toc" aria-label="Sommaire">${hs.map(h=>`<a href="#wiki-${a.id}" data-s="${h[1]}">${h[2]}</a>`).join("")}</nav>`:""}${a.html}<div class="pn">${p?`<a class="card" href="#wiki-${p.id}"><small>Précédent</small>${p.title}</a>`:""}${n?`<a class="card" href="#wiki-${n.id}"><small>Suivant</small>${n.title}</a>`:""}</div></article></div>`}
function home(){const rows=[["Kits par grade","Sept kits, trois liés à un grade, avec des délais de 1 à 3 heures.","#wiki-grades-kits"],["Factions et îles","Chef, officiers, membres, claims et une île de 25 × 25 blocs.","#wiki-factions"],["Trois métiers","Mineur, Farmeur et Guerrier, niveaux 1 à 20.","#wiki-metiers"],["KOTH, Outpost, Nexus","Trois événements de zone, dont un boss.","#wiki-events"],["Équipement custom","Galaxium, Jade, Crystallium et Pickaxe of God.","#wiki-objets"],["Calculateurs","Pioche, métiers, argent passif.","#wiki-outils"]];
return`<section class="hero fade"><div><div class="eyebrow">Serveur Minecraft Bedrock</div><h1>Galaxium<br>KitMap</h1><p class="lead">Tout pour bien jouer : choisis une orbite ou tape une commande pour trouver ce qu’il te faut.</p><div class="cta"><a class="btn p" href="#wiki">Ouvrir le wiki</a><a class="btn" href="#shop">Boutique</a></div></div><div class="orbwrap">${orbit()}</div></section>
<section class="sec"><div class="eyebrow">Console</div><h2>Pilote le site comme le serveur</h2><p class="lead">Tape une commande ou un mot-clé pour la retrouver dans le wiki.</p><div class="term"><div class="tb"><i></i><i></i><i></i><span>galaxium@kitmap</span></div><label class="tl"><span>/galaxium:</span><input id="cn" type="text" placeholder="kit" aria-label="Commande ou mot-clé" autocomplete="off" autocapitalize="off" spellcheck="false"></label><div class="sg">${["kit","refill","faction","job","market","nexus"].map(c=>`<button data-fill="${c}">${c}</button>`).join("")}</div><div id="co"></div></div></section>
<section class="sec"><h2>Ce que contient le serveur</h2><div style="margin-top:14px">${rows.map((f,i)=>`<a class="row" href="${f[2]}"><span class="num">0${i+1}</span><span><b>${f[0]}</b><small>${f[1]}</small></span><span class="ar" aria-hidden="true">→</span></a>`).join("")}</div></section>
<section class="sec"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><a class="card big" href="#shop"><h2>Boutique</h2><p>Les articles arriveront ultérieurement.</p></a><a class="card big" href="#wiki"><h2>Wiki</h2><p>Commandes, kits, métiers, factions et objets.</p></a></div></section>`}
function shop(){const f=PRODUCTS.filter(p=>!window._c||p.category===window._c);
 return`<section class="fade" style="padding:56px 0"><div class="eyebrow">Boutique</div><h1 style="font-size:clamp(30px,5vw,46px)">Boutique Galaxium</h1><p class="lead">Grades, cosmétiques et objets pourront être proposés ici.</p>
<div class="field" style="margin-top:22px" role="search"><span aria-hidden="true">⌕</span><input id="sq" type="search" placeholder="Rechercher un produit" aria-label="Rechercher un produit"></div>
${CATEGORIES.length?`<div class="chips">${CATEGORIES.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join("")}</div>`:""}
<div id="pg">${f.length?grid(f):`<div class="empty"><div class="slots" aria-hidden="true">${"<i></i>".repeat(9)}</div><h3>La boutique arrive bientôt.</h3><p>Les articles seront disponibles ultérieurement.</p></div>`}</div></section>`}
function nf(){return`<section class="empty fade" style="margin-top:60px"><h3>Page introuvable</h3><p>Ce lien ne mène nulle part.</p><p style="margin-top:16px"><a class="btn p" href="#home">Retour à l’accueil</a></p></section>`}
function route(){const h=(location.hash||"#home").slice(1);let r="home",html;
 if(h==="home")html=home();else if(h==="shop"){r="shop";html=shop()}else if(h==="wiki"){r="wiki";html=wikiHome()}
 else if(h.startsWith("wiki-")){r="wiki";const a=ARTS.find(x=>x.id===h.slice(5));html=a?article(a):nf()}else html=nf();
 app.innerHTML=html;document.querySelectorAll("nav.main a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
 $("#nv").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");
 const t=h.startsWith("wiki-")?ARTS.find(x=>x.id===h.slice(5)):null;document.title=(t?t.title+" — Wiki ":r==="shop"?"Boutique — ":r==="wiki"?"Wiki — ":"")+"Galaxium KitMap";window.scrollTo(0,0);
 const i=$("#q");if(i){i.oninput=()=>{q=i.value;$("#rs").innerHTML=results();$("#cats").hidden=!!q.trim();$("#x").hidden=!q};$("#x").onclick=()=>{q="";i.value="";i.oninput();i.focus()}}
 initTools();initHome();const tg=$("#tg");if(tg)tg.onclick=()=>{const s=$("#sd");s.classList.toggle("show");tg.setAttribute("aria-expanded",s.classList.contains("show"))};
 document.querySelectorAll(".toc a").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.s);el&&el.scrollIntoView({behavior:"smooth"})});
 bindPay();const sq=$("#sq");if(sq)sq.oninput=()=>{if(!PRODUCTS.length)return;const v=norm(sq.value);$("#pg").innerHTML=grid(PRODUCTS.filter(p=>norm(p.name).includes(v)));bindPay()}}
$("#mb").onclick=()=>{const o=$("#nv").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)};
addEventListener("hashchange",route);
addEventListener("keydown",e=>{const t=e.target.tagName;if(e.key==="Escape")closeP();else if((e.key==="/"&&t!=="INPUT")||((e.ctrlKey||e.metaKey)&&e.key==="k")){e.preventDefault();openP()}});
/* Anti copier-coller et anti-zoom (dissuasif : le code source reste lisible) */
const inp=e=>e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
["copy","cut","contextmenu","dragstart"].forEach(n=>document.addEventListener(n,e=>{if(!inp(e))e.preventDefault()}));
document.addEventListener("selectstart",e=>{if(!inp(e))e.preventDefault()});
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&/^[acxsu+\-=0]$/i.test(e.key)&&!inp(e))e.preventDefault()});
$("#lg").src=LOGO;$("#fv").href=LOGO;route();
</script></body></html>
